Architecture: amd64
Config:
    Cmd:
        - nginx
        - -g
        - daemon off;
    Entrypoint:
        - /docker-entrypoint.sh
    Env:
        - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - NGINX_VERSION=1.31.3
        - PKG_RELEASE=1
        - DYNPKG_RELEASE=1
        - NJS_VERSION=1.0.0
        - NJS_RELEASE=1
        - ACME_VERSION=0.4.1
    ExposedPorts:
        80/tcp: {}
    Labels:
        maintainer: NGINX Docker Maintainers <docker-maint@nginx.com>
    StopSignal: SIGQUIT
    WorkingDir: /
